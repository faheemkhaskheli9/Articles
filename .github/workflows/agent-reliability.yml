name: AI Agent Reliability article tests
on:
  push:
    paths:
      - 'articles/the-tool-call-was-correct-the-ai-agent-was-still-wrong/**'
      - 'examples/agent-reliability/**'
      - '.github/workflows/agent-reliability.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/agent-reliability
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - run: python -m agent_reliability --json
      - run: python tools/build_html.py --check
