name: Edge inference economics example
on:
  push:
    paths:
      - 'articles/edge-inference-economics/**'
      - 'examples/edge-inference-economics/**'
      - '.github/workflows/edge-inference-economics.yml'
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/edge-inference-economics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m compileall -q cost_demo.py
      - run: python cost_demo.py --config scenario.json --sweep
