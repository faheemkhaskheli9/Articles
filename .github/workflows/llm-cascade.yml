name: LLM cascade example
on:
  push:
    paths:
      - 'articles/llm-cascade/**'
      - 'examples/llm-cascade/**'
      - 'tools/build_medium_html.py'
      - '.github/workflows/llm-cascade.yml'
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/llm-cascade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - run: ruff check .
      - run: python -m pytest -q
      - run: python -m llm_cascade demo
      - run: python -m llm_cascade evaluate
      - run: python ../../tools/build_medium_html.py llm-cascade --check
